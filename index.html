<html lang="en">
<head>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Text:ital@0;1&family=IBM+Plex+Serif:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">


    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div id="header">
        <h1>Bossons Tuff Shop</h1>
        <button id="cart-button">CART</button>
    </div>
    
    <div id="cart-container">
        <div id="cart-body">
            <div id="cart-header">
                <h2>CART</h2>
                <button id="cart-exit">X</button>
            </div>
            <div id="cart">
                <h3>Items</h3>
                <ul id="cart-products">
                </ul>
                <h3>Coupons</h3>
                <ul id="cart-coupons">
                </ul>
            <h3>Total:</h3></div>
            <div id="cart-coupon-redeem">
                <input type="text">
                <button>Redeem</button>
            </div>
        </div>
    </div>

    <div id="hero">
        <h1>Bosson's Tuff Shop</h1>
    </div>

    <div id="main">
        <div id="product-container">
        </div>
        <div id="filter-container">
            <h2>FILTERS</h2>
            <ul id="filter-list">
            </ul>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
