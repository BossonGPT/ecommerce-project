<html lang="en">
<head>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Monomaniac+One&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div id="header">
        <h2>Bossons Tuff Shop</h2>
        <button id="cart-button">CART</button>
    </div>
    

    <div id="cart-container">
        <div id="cart-body">
            <div id="cart-header">
                <h2>CART</h2>
                <button id="cart-exit">X</button>
            </div>
            <div id="cart">
                <h3>Items</h3>
                <ul id="cart-products">
                </ul>
                <h3>Coupons</h3>
                <ul id="cart-coupons">
                </ul>
            <h2 id="cart-total">Total:</h2></div>
            <form action="" id="cart-coupon-redeem">
                <label for="">Redeem Code</label>
                <br>
                <input type="text" id="cart-coupon-redeem-text-box">
                <button id="cart-coupon-redeem-button">Redeem</button>
            </form>
        </div>
    </div>

    <div id="hero">
        <h1>Bosson's Tuff Shop <span class="hero-small-text">(welcome!)</span></h1>
    
    </div>

    <div id="main">
        <div id="filter-container">
            <h2>FILTERS</h2>
            <ul id="filter-list">
            </ul>
        </div>
        <div id="product-container">
        </div>

    </div>

    <script src="main.js"></script>
</body>
</html>
